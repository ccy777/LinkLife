name: linklife-rmq-it-timeout

services:
  mysql:
    image: mysql:8.0.42
    container_name: linklife-rmq-it-timeout-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: linklife_rmq_timeout_test
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:33316:3306"
    volumes:
      - linklife-rmq-it-timeout-mysql-data:/var/lib/mysql
      - ../../linklife-transaction-service/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot"]
      interval: 3s
      timeout: 2s
      retries: 40

  redis:
    image: redis:7.2.10
    container_name: linklife-rmq-it-timeout-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:36389:6379"
    volumes:
      - linklife-rmq-it-timeout-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 40

  namesrv:
    image: apache/rocketmq:5.5.0
    container_name: linklife-rmq-it-timeout-namesrv
    # 仅限本地单机集成拓扑：named volume 初始由 root 创建，确保官方镜像可初始化日志目录。
    user: root
    command: sh mqnamesrv
    ports:
      - "127.0.0.1:39876:9876"
    volumes:
      - linklife-rmq-it-timeout-namesrv-logs:/home/rocketmq/logs

  broker:
    image: apache/rocketmq:5.5.0
    container_name: linklife-rmq-it-timeout-broker
    # 仅限本地单机集成拓扑：允许 Broker/Proxy 初始化隔离的 store/log named volumes。
    user: root
    depends_on:
      - namesrv
    environment:
      NAMESRV_ADDR: namesrv:9876
    command: sh mqbroker --enable-proxy -c /home/rocketmq/rocketmq-5.5.0/conf/linklife-broker.conf
    ports:
      - "127.0.0.1:30911:10911"
      - "127.0.0.1:38080:8080"
      - "127.0.0.1:38081:8081"
    volumes:
      - ./broker.conf:/home/rocketmq/rocketmq-5.5.0/conf/linklife-broker.conf:ro
      - ./rmq-proxy.json:/home/rocketmq/rocketmq-5.5.0/conf/rmq-proxy.json:ro
      - linklife-rmq-it-timeout-broker-store:/home/rocketmq/store
      - linklife-rmq-it-timeout-broker-logs:/home/rocketmq/logs

  rocketmq-init:
    image: apache/rocketmq:5.5.0
    depends_on:
      - namesrv
      - broker
    entrypoint: ["sh", "-ec"]
    command:
      - |
        admin=/home/rocketmq/rocketmq-5.5.0/bin/mqadmin
        for attempt in $$(seq 1 60); do
          if $$admin clusterList -n namesrv:9876 >/dev/null 2>&1; then
            $$admin updateTopic -n namesrv:9876 -c linklifeRmqItCluster \
              -t linklife-order-payment-timeout-it -a +message.type=DELAY
            $$admin updateSubGroup -n namesrv:9876 -c linklifeRmqItCluster \
              -g linklife-rmq-it-timeout-v1
            exit 0
          fi
          sleep 2
        done
        echo "RocketMQ broker did not become ready" >&2
        exit 1

  # Docker Desktop 不把 Linux 容器网段直接路由给 Windows 宿主机；真实 gRPC 客户端
  # 因而在同一任务网络内运行。profile 保证普通 compose up 不会启动测试执行器。
  integration-runner:
    image: maven:3.9.11-eclipse-temurin-17
    profiles: ["manual-test"]
    working_dir: /workspace
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker:
        condition: service_started
      rocketmq-init:
        condition: service_completed_successfully
    environment:
      TZ: Asia/Shanghai
      LINKLIFE_MANUAL_INTEGRATION_ENABLED: "true"
      LINKLIFE_MANUAL_CONFIRM_ISOLATED: "true"
      LINKLIFE_MANUAL_REDIS_HOST: redis
      LINKLIFE_MANUAL_REDIS_PORT: "6379"
      LINKLIFE_MANUAL_REDIS_PASSWORD: ""
      LINKLIFE_MANUAL_REDIS_DATABASE: "12"
      LINKLIFE_MANUAL_DB_URL: jdbc:mysql://mysql:3306/linklife_rmq_timeout_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      LINKLIFE_MANUAL_DB_USERNAME: root
      LINKLIFE_MANUAL_DB_PASSWORD: ""
      LINKLIFE_MANUAL_ROCKETMQ_ENDPOINTS: broker:8081
    volumes:
      - ../../..:/workspace
      - linklife-rmq-it-timeout-maven-cache:/root/.m2/repository

volumes:
  linklife-rmq-it-timeout-mysql-data:
    name: linklife-rmq-it-timeout-mysql-data
  linklife-rmq-it-timeout-redis-data:
    name: linklife-rmq-it-timeout-redis-data
  linklife-rmq-it-timeout-namesrv-logs:
    name: linklife-rmq-it-timeout-namesrv-logs
  linklife-rmq-it-timeout-broker-store:
    name: linklife-rmq-it-timeout-broker-store
  linklife-rmq-it-timeout-broker-logs:
    name: linklife-rmq-it-timeout-broker-logs
  linklife-rmq-it-timeout-maven-cache:
    name: linklife-rmq-it-timeout-maven-cache
